spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ibkr-java-trading-system
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/ibkr-paper-trading;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  main:
    banner-mode: off

server:
  port: ${SERVER_PORT:8080}

historical-data:
  provider: STOOQ
  cache-enabled: true

stooq:
  enabled: true
  import-directory: ./data/stooq
  accept-zero-volume: true
  default-market-suffix: US
  price-adjustment: RAW

trading:
  # Questa versione accetta BACKTEST e PAPER. LIVE resta bloccato.
  mode: ${TRADING_MODE:PAPER}
  live-trading-enabled: ${LIVE_TRADING_ENABLED:false}

  # False per impostazione predefinita. Abilitare solo dopo aver configurato
  # l'account paper esatto e verificato gli endpoint in sola generazione segnali.
  order-submission-enabled: ${IBKR_PAPER_ORDERS_ENABLED:false}
  paper-account-confirmation: ${PAPER_ACCOUNT_CONFIRMATION:}

  ibkr:
    host: ${IBKR_HOST:127.0.0.1}
    # TWS Paper 7497; IB Gateway Paper 4002.
    port: ${IBKR_PORT:7497}
    client-id: ${IBKR_CLIENT_ID:21}
    historical-data-timeout: ${IBKR_HISTORICAL_DATA_TIMEOUT:30s}
    account-id: ${IBKR_PAPER_ACCOUNT_ID:DUR883004}
    auto-connect: ${IBKR_AUTO_CONNECT:false}
    allow-custom-paper-port: ${IBKR_ALLOW_CUSTOM_PAPER_PORT:false}
    connection-timeout: ${IBKR_CONNECTION_TIMEOUT:10s}
    reconnect:
      enabled: ${IBKR_RECONNECT_ENABLED:true}
      delay: ${IBKR_RECONNECT_DELAY:5s}
      max-attempts: ${IBKR_RECONNECT_MAX_ATTEMPTS:5}

  market-data:
    enabled: ${IBKR_MARKET_DATA_ENABLED:true}
    provider: IBKR
    # DELAYED è il default più semplice per iniziare.
    # Con abbonamenti dati adeguati può essere impostato LIVE.
    mode: ${IBKR_MARKET_DATA_MODE:DELAYED}
  strategy:
    enabled: ${STRATEGY_ENABLED:true}
    # Calcola e salva segnali, ma non li invia automaticamente per default.
    auto-execute-signals: ${AUTO_EXECUTE_SIGNALS:false}
    fast-period: ${STRATEGY_FAST_PERIOD:5}
    slow-period: ${STRATEGY_SLOW_PERIOD:20}
    quantity: ${STRATEGY_QUANTITY:1}
    signal-cooldown: ${STRATEGY_SIGNAL_COOLDOWN:1m}

  risk:
    trading-capital: ${RISK_TRADING_CAPITAL:10000}
    risk-per-trade-percent: ${RISK_PER_TRADE_PERCENT:2.0}
    allow-long: ${RISK_ALLOW_LONG:true}
    allow-short-selling: ${RISK_ALLOW_SHORT:true}
    use-leverage: ${RISK_USE_LEVERAGE:false}
    max-long-notional: ${RISK_MAX_LONG_NOTIONAL:10000}
    max-short-notional: ${RISK_MAX_SHORT_NOTIONAL:10000}
    max-order-value: ${RISK_MAX_ORDER_VALUE:5000}
    max-position-value: ${RISK_MAX_POSITION_VALUE:10000}
    max-quantity-per-order: ${RISK_MAX_QUANTITY:1000}
    max-daily-orders: ${RISK_MAX_DAILY_ORDERS:20}
    max-open-orders: ${RISK_MAX_OPEN_ORDERS:10}
    max-daily-loss: ${RISK_MAX_DAILY_LOSS:250}
    entry-ticket: ${RISK_ENTRY_TICKET:0.01}
    commission-per-order: ${RISK_COMMISSION_PER_ORDER:0}
    slippage-percent: ${RISK_SLIPPAGE_PERCENT:0}
    transaction-costs-per-share: ${RISK_TRANSACTION_COSTS_PER_SHARE:0}
    progressive-stop:
      enabled: ${PROGRESSIVE_STOP_ENABLED:true}
      move-only-after-full-tp-fill: ${MOVE_STOP_ONLY_AFTER_FULL_TP_FILL:true}
      after-tp1:
        move-to: ${PROGRESSIVE_STOP_AFTER_TP1:ENTRY}
      after-tp2:
        move-to: ${PROGRESSIVE_STOP_AFTER_TP2:TP1}
      after-tp3:
        move-to: ${PROGRESSIVE_STOP_AFTER_TP3:TP2}

  take-profit:
    enabled: ${TAKE_PROFIT_ENABLED:true}
    target-1:
      profit-percent: ${TAKE_PROFIT_1_PROFIT_PERCENT:2.0}
      position-percent: ${TAKE_PROFIT_1_POSITION_PERCENT:50.0}
    target-2:
      profit-percent: ${TAKE_PROFIT_2_PROFIT_PERCENT:4.0}
      position-percent: ${TAKE_PROFIT_2_POSITION_PERCENT:30.0}
    target-3:
      profit-percent: ${TAKE_PROFIT_3_PROFIT_PERCENT:8.0}
      position-percent: ${TAKE_PROFIT_3_POSITION_PERCENT:20.0}

  orders:
    entry-time-in-force: ${ORDER_ENTRY_TIF:DAY}
    protective-time-in-force: ${ORDER_PROTECTIVE_TIF:GTC}
    outside-regular-trading-hours: ${ORDER_OUTSIDE_RTH:false}
    inter-order-delay: ${ORDER_INTER_ORDER_DELAY:25ms}

logging:
  level:
    root: INFO
    it.andreademartini.trading: DEBUG

backtest:
  same-bar-execution-policy: ${BACKTEST_SAME_BAR_EXECUTION_POLICY:STOP_FIRST}

excel-export:
  enabled: ${EXCEL_EXPORT_ENABLED:true}
  historical-bars-before-entry: ${EXCEL_EXPORT_HISTORICAL_BARS_BEFORE_ENTRY:30}
  historical-bars-after-exit: ${EXCEL_EXPORT_HISTORICAL_BARS_AFTER_EXIT:10}
  include-strategy-indicators: ${EXCEL_EXPORT_INCLUDE_STRATEGY_INDICATORS:true}
  include-trade-chart: ${EXCEL_EXPORT_INCLUDE_TRADE_CHART:false}
  colors:
    enabled: ${EXCEL_EXPORT_COLORS_ENABLED:true}
